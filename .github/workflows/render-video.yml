name: Render + Upload Video (Steps 2 + 3)

# Runs automatically twice a day, every day — timed for the US tech-audience
# peak windows (converted to UTC): 12:00 UTC = 8 AM US Eastern (morning
# routine browsing) and 16:00 UTC = 12 PM US Eastern (lunch break, the
# strongest engagement window). In Pakistan time (PKT) that's 5 PM and 9 PM.
#
# You can still trigger it manually any time from the Actions tab too —
# useful for a one-off unlisted test run before trusting the schedule.
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      privacy:
        description: "YouTube privacy status for this upload"
        required: true
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python dependencies
        run: pip install edge-tts requests google-auth google-auth-oauthlib google-api-python-client

      - name: Run render pipeline
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/render_video.py

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Scheduled (cron) runs have no "inputs" — default to "public" for
          # those. Manual runs still let you pick unlisted/private for testing.
          YT_PRIVACY_STATUS: ${{ github.event.inputs.privacy || 'public' }}
        run: python scripts/upload_youtube.py

      - name: Upload artifacts (video + thumbnail + metadata + result)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.run_number }}
          path: |
            output/final_video.mp4
            output/thumbnail.png
            output/metadata.json
            output/upload_result.json
          retention-days: 14
